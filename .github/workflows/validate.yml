name: Verify Jibo NOVA Community themes

on:
  push:
    paths:
      - 'themes/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'themes/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public community repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install image decoder for validation
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate and rebuild all installable theme archives
        run: python scripts/validate_all.py
      - name: Verify committed release ZIPs match reproducible rebuild
        run: git diff --exit-code -- themes

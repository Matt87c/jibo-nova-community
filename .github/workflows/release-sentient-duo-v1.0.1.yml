name: Release NOVA Sentient Eye Duo v1.0.1

on:
  push:
    branches: [main]
    paths:
      - 'release-trigger/sentient-duo-v1.0.1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jibo-sentient-duo-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned PNG validator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Rebuild and verify both existing eye themes
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for slug in jibo-nova-sentient-eye-theme jibo-nova-sentient-orb-theme; do
            python "themes/$slug/scripts/build_release.py"
            python "themes/$slug/scripts/validate_release.py"
            cp "themes/$slug/dist/$slug.zip" release-assets/
          done
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
          git diff --exit-code -- themes
      - name: Write exact release notes
        run: |
          cat > release-assets/RELEASE_NOTES.md <<'NOTES'
          # NOVA Sentient Eye Duo v1.0.1

          Updated existing, independently installable **NOVA Sentient Eye** (almond)
          and **NOVA Sentient Orb** (round) themes for Jibo 5x1/OpenJibo and BEacon.
          The original idle/open and closed-eye artwork is unchanged.

          ## What's improved
          - Fixed the previous issue where eyeListening.png and eye.png were identical.
          - Added a distinct electric-blue illuminated listening iris based on each original design.
          - Preserved the original eye silhouette, alpha transparency, size and idle appearance.
          - Expanded developer (Matt87c), install, validation, rollback and Store information.

          ## Download and install
          Download **one of the two ZIP assets attached to this release**.
          In BEacon open **Store > Themes > three-dot menu > Upload Theme ZIP**,
          choose the ZIP as-is, select the theme and **Apply**.
          For stock appearance, select **None**.

          **Hardware note:** Owner reported both updated themes working in a local
          Jibo test. This is not certification that all hardware acceptance scenarios
          have passed on all supported robots.

          **Talk to NOVA:** Theme packages supply the blue native listening image.
          Pulsing animation, violet thinking indication, and cyan-green speaking
          indication are separate skill features and not included in these ZIPs.

          ## Included assets
          - jibo-nova-sentient-eye-theme.zip (theme 1.0.1)
          - jibo-nova-sentient-orb-theme.zip (theme 1.0.1)
          - SHA256SUMS.txt

          These are theme-only packages, with no gateway configuration,
          private addresses, credentials or runtime skill code. They are
          community themes by Matt87c, not official Jibo or BEacon releases.
          NOTES
      - name: Publish new tagged duo release (do not overwrite existing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "sentient-duo-v1.0.1" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "sentient-duo-v1.0.1" \
            release-assets/jibo-nova-sentient-eye-theme.zip \
            release-assets/jibo-nova-sentient-orb-theme.zip \
            release-assets/SHA256SUMS.txt \
            --title "NOVA Sentient Eye Duo v1.0.1" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"

name: Publish Jibo NOVA Community prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Unique prerelease tag, for example community-rc-2026-11-01-1'
        required: true
        default: 'community-rc-2026-11-01-1'
        type: string

permissions:
  contents: write

concurrency:
  group: jibo-nova-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify and prepare five ZIPs and checksums
        run: python scripts/build_bundle.py
      - name: Reject stale packaged ZIPs
        run: git diff --exit-code -- themes
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^community-rc-[A-Za-z0-9._-]{5,60}$ ]]; then
            echo 'Release tag must begin community-rc- and have only safe tag characters.' >&2
            exit 1
          fi
      - name: Create GitHub prerelease with individually installable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already published. Choose a new unique release candidate tag." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --title "Jibo NOVA Community - release candidate $RELEASE_TAG" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --prerelease

name: Package NOVA Sentient theme test ZIPs

on:
  push:
    branches:
      - fix/sentient-listening-release-readiness
    paths:
      - 'themes/jibo-nova-sentient-*/**'
      - '.github/workflows/sentient-candidate.yml'
  pull_request:
    paths:
      - 'themes/jibo-nova-sentient-*/**'
      - '.github/workflows/sentient-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate theme source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build and validate unchanged designs with blue listening variant
        run: |
          set -e
          for slug in jibo-nova-sentient-eye-theme jibo-nova-sentient-orb-theme; do
            python "themes/$slug/scripts/build_release.py"
            python "themes/$slug/scripts/validate_release.py"
          done
          mkdir -p candidate
          cp themes/jibo-nova-sentient-eye-theme/dist/jibo-nova-sentient-eye-theme.zip candidate/
          cp themes/jibo-nova-sentient-orb-theme/dist/jibo-nova-sentient-orb-theme.zip candidate/
          cd candidate
          sha256sum *.zip > SHA256SUMS.txt
      - name: Upload separately installable BEacon ZIPs for Jibo hardware testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-sentient-1.0.1-test-zips
          path: candidate/
          if-no-files-found: error
          retention-days: 14
